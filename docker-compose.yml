version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fumetteria_db
    restart: always
    environment:
      POSTGRES_USER: umberto_admin
      POSTGRES_PASSWORD: super_secret_password123
      POSTGRES_DB: fumetteria_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: